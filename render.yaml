# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: uniclife-keycabinet-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @uniclife/backend build && pnpm --filter @uniclife/backend db:migrate
    startCommand: pnpm --filter @uniclife/backend start
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - backend/**
        - shared/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - render.yaml
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "5"
      - key: HOST
        value: 0.0.0.0
      - key: LOG_LEVEL
        value: info
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: AUTH_TOKEN_PEPPER
        generateValue: true
      - key: AUTH_SESSION_TTL_DAYS
        value: "30"
      - key: AUTH_RESET_TTL_MINUTES
        value: "10"
      - key: AUTH_ALLOW_RESET_CODE_PREVIEW
        value: "false"
      - key: UV_THREADPOOL_SIZE
        value: "2"
