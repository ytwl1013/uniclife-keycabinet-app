name: uniclife-keycabinet-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycabinet_dev
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: keycabinet_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - keycabinet_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycabinet_dev -d keycabinet_dev"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  keycabinet_pg_data:
