name: CI

on:
  pull_request:
    branches:
      - dev
      - main
      - backend_main
  push:
    branches:
      - dev
      - main
      - backend_main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: keycabinet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/keycabinet_test
      RUN_DATABASE_TESTS: 'true'
      FRONTEND_ORIGIN: http://192.168.50.53:8081
      LOG_LEVEL: silent
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check repository policy
        shell: bash
        run: |
          test -f AGENTS.md
          test -f README.md

          forbidden_files="$(
            find . -path './.git' -prune -o -type f \
              \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) \
              ! -name '.env.example' \
              ! -name '.env.*.example' \
              -print
          )"
          if [ -n "$forbidden_files" ]; then
            echo "Forbidden secret-like files are present:"
            echo "$forbidden_files"
            exit 1
          fi

          if grep -RInE 'BEGIN ((RSA|OPENSSH|EC|DSA) )?PRIVATE KEY' . --exclude-dir=.git; then
            echo "Private key material must not be committed."
            exit 1
          fi

          if grep -RInE '^[[:space:]]*[A-Z0-9_]*(TOKEN|SECRET|PASSWORD|PRIVATE_KEY|API_KEY)[[:space:]]*=[[:space:]]*['"'"'"]?[A-Za-z0-9_./+=-]{12,}' . --exclude-dir=.git --exclude=.gitlab-ci.yml; then
            echo "Secret-like environment assignments must not be committed."
            exit 1
          fi

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - name: Generate ephemeral test admin token
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'ADMIN_API_TOKEN=' + require('node:crypto').randomBytes(32).toString('hex') + '\n')"

      - name: Prepare isolated test database
        run: |
          pnpm --filter @uniclife/shared build
          pnpm --filter @uniclife/backend exec drizzle-kit migrate
          pnpm --filter @uniclife/backend exec tsx src/db/seed.ts

      - name: Run project checks
        run: pnpm check

      - name: Build backend
        run: pnpm --filter @uniclife/backend build
