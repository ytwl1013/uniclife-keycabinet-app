stages:
  - validate

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

repository_policy:
  stage: validate
  image: alpine:3.20
  script:
    - test -f AGENTS.md
    - test -f README.md
    - |
      forbidden_files="$(
        find . -path './.git' -prune -o -type f \
          \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' \) \
          ! -name '.env.example' \
          ! -name '.env.*.example' \
          -print
      )"
      if [ -n "$forbidden_files" ]; then
        echo "Forbidden secret-like files are present:"
        echo "$forbidden_files"
        exit 1
      fi
    - |
      if grep -RInE 'BEGIN ((RSA|OPENSSH|EC|DSA) )?PRIVATE KEY' . --exclude-dir=.git; then
        echo "Private key material must not be committed."
        exit 1
      fi
    - |
      if grep -RInE '^[[:space:]]*[A-Z0-9_]*(TOKEN|SECRET|PASSWORD|PRIVATE_KEY|API_KEY)[[:space:]]*=[[:space:]]*['"'"'"]?[A-Za-z0-9_./+=-]{12,}' . --exclude-dir=.git --exclude=.gitlab-ci.yml; then
        echo "Secret-like environment assignments must not be committed."
        exit 1
      fi

application_checks:
  stage: validate
  image: node:22-bookworm
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    NODE_ENV: test
    POSTGRES_HOST_AUTH_METHOD: trust
    POSTGRES_DB: keycabinet_test
    DATABASE_URL: postgres://postgres@postgres:5432/keycabinet_test
    RUN_DATABASE_TESTS: "true"
    FRONTEND_ORIGIN: http://192.168.50.53:8081
    LOG_LEVEL: silent
  before_script:
    - corepack enable
    - pnpm install --frozen-lockfile
  script:
    - pnpm --filter @uniclife/shared build
    - pnpm --filter @uniclife/backend exec drizzle-kit migrate
    - pnpm --filter @uniclife/backend exec tsx src/db/seed.ts
    - pnpm --filter @uniclife/backend --filter @uniclife/frontend lint
    - pnpm --filter @uniclife/backend --filter @uniclife/frontend typecheck
    - pnpm --filter @uniclife/backend --filter @uniclife/frontend test
    - pnpm --filter @uniclife/backend build
